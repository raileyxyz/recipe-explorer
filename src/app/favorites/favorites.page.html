<app-page-header title="Favorites"></app-page-header>

<ion-content>
  <div class="page">
    <div class="section-title">
      <h2>Saved Recipes</h2>
      <span>{{ favoritesService.favorites().length }} saved</span>
    </div>

    @if (favoritesService.favorites().length === 0) {
    <div class="empty">
      <p class="empty-title">No favorites yet</p>
      <p>Tap the heart on a recipe to save it here.</p>
    </div>
    }

    <div class="grid">
      @for (recipe of favoritesService.favorites(); track recipe.id) {
      <app-recipe-card [recipe]="recipe"></app-recipe-card>
      }
    </div>
  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <app-bottom-nav active="favorites"></app-bottom-nav>
</ion-footer>
