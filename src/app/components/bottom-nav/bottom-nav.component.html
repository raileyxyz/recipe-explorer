<nav class="bottom-nav">
  @for (item of items; track item.key) {
    <button class="nav-item" [class.active]="item.key === active" [class.disabled]="!item.ready" (click)="go(item)">
      <ion-icon [name]="item.key === active ? item.iconActive : item.icon"></ion-icon>
      <span>{{ item.label }}</span>
    </button>
  }
</nav>
